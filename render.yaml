services:
  - type: web
    name: alkmaar-roleplay
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 20.11.1
      - key: FIVEM_JOIN_CODE
        value: r7yby7
      - key: FIVEM_SERVER_HOST
        sync: false
      # De onderstaande waarden vul je in het Render-dashboard in.
      - key: SITE_URL
        sync: false
      - key: DISCORD_BOT_TOKEN
        sync: false
      - key: DISCORD_GUILD_ID
        sync: false
      - key: DISCORD_STAFF_ROLES
        sync: false
